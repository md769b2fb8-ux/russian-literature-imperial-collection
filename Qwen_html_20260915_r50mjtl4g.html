<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Russian Literature — Imperial Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F3E9D2;
    --parchment-light:#F5EFDF;
    --emerald:#1F3D2E;
    --marsala:#7A2E22;
    --gold:#B8863B;
    --gold-light:#C9A227;
    --gold-shadow:#8B6F35;
    --ink:#3D2B1F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    background:var(--parchment);
    color:var(--ink);
    min-height:100vh;
    background-image:radial-gradient(ellipse at top,rgba(184,134,59,.04) 0%,transparent 60%),radial-gradient(ellipse at bottom,rgba(122,46,34,.03) 0%,transparent 60%);
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.24  0 0 0 0 0.17  0 0 0 0 0.12  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    pointer-events:none;opacity:.6;z-index:0;
  }
  .page{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:40px 30px 80px}

  /* ===== HEADER ===== */
  header{
    text-align:center;padding:60px 40px 50px;position:relative;
    border:1px solid var(--gold);margin-bottom:50px;
    background:linear-gradient(180deg,rgba(245,239,223,.6) 0%,rgba(243,233,210,.3) 100%);
  }
  header::before,header::after{
    content:"";position:absolute;width:60px;height:60px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M5,5 Q5,50 50,50 Q5,50 5,95' stroke='%23B8863B' stroke-width='1.5' fill='none'/><path d='M5,5 Q50,5 50,50 Q50,5 95,5' stroke='%23B8863B' stroke-width='1.5' fill='none'/><circle cx='50' cy='50' r='3' fill='%23B8863B'/></svg>");
    background-size:contain;background-repeat:no-repeat;
  }
  header::before{top:-8px;left:-8px}
  header::after{top:-8px;right:-8px;transform:scaleX(-1)}
  .header-ornament-bottom{
    position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    width:200px;height:30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30'><path d='M0,15 Q50,0 100,15 Q150,30 200,15' stroke='%23B8863B' stroke-width='1' fill='none'/><circle cx='100' cy='15' r='4' fill='none' stroke='%23B8863B' stroke-width='1'/><circle cx='100' cy='15' r='1.5' fill='%23B8863B'/></svg>");
    background-size:contain;background-repeat:no-repeat;
  }
  .eyebrow{font-family:'Cormorant',serif;font-size:13px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold-shadow);margin-bottom:18px;}
  header h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(38px,6vw,72px);line-height:1;color:var(--ink);letter-spacing:.02em;margin-bottom:8px;}
  header h1 .amp{color:var(--marsala);font-style:italic;font-weight:400}
  header .subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(16px,2vw,22px);color:var(--marsala);margin-top:14px;letter-spacing:.03em;}
  .header-line{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto 0;}
  .author-tag{display:inline-block;margin-top:22px;font-family:'Cormorant',serif;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-shadow);border:1px solid var(--gold);padding:6px 18px;}
  .author-tag a{color:inherit;text-decoration:none}.author-tag a:hover{color:var(--marsala)}

  /* ===== ERA ===== */
  .era-section{margin-bottom:70px}
  .era-header{display:flex;align-items:center;gap:20px;margin-bottom:40px;padding:18px 30px;background:var(--emerald);color:var(--parchment-light);position:relative;}
  .era-header::before,.era-header::after{content:"";position:absolute;width:24px;height:24px;border:1px solid var(--gold-light);}
  .era-header::before{top:6px;left:6px;border-right:none;border-bottom:none}
  .era-header::after{bottom:6px;right:6px;border-left:none;border-top:none}
  .era-year{font-family:'Playfair Display',serif;font-weight:700;font-size:14px;letter-spacing:.3em;color:var(--gold-light);white-space:nowrap;}
  .era-title{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(22px,3vw,32px);letter-spacing:.04em;flex:1;}
  .era-count{font-family:'Cormorant',serif;font-size:12px;letter-spacing:.3em;color:var(--gold-light);text-transform:uppercase;}

  /* ===== BOOKS ===== */
  .books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;}
  .book-card{
    background:var(--parchment-light);border:1px solid rgba(184,134,59,.4);
    padding:28px 24px 24px;cursor:pointer;transition:all .4s;
    position:relative;display:flex;flex-direction:column;min-height:340px;
  }
  .book-card::before,.book-card::after{content:"";position:absolute;width:16px;height:16px;border:1px solid var(--gold);transition:all .4s;}
  .book-card::before{top:4px;left:4px;border-right:none;border-bottom:none}
  .book-card::after{bottom:4px;right:4px;border-left:none;border-top:none}
  .book-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(61,43,31,.15);border-color:var(--gold);}
  .book-card:hover::before,.book-card:hover::after{width:22px;height:22px}

  .book-icon{width:90px;height:90px;margin:0 auto 20px;background:var(--parchment);border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(139,111,53,.15);position:relative;}
  .book-icon svg{width:50px;height:50px}
  .book-icon::after{content:"";position:absolute;inset:4px;border:1px solid rgba(184,134,59,.3);border-radius:50%;}

  .book-title{font-family:'Playfair Display',serif;font-weight:700;font-size:20px;line-height:1.2;color:var(--ink);text-align:center;margin-bottom:8px;letter-spacing:.01em;}
  .book-author{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--marsala);text-align:center;margin-bottom:14px;}
  .book-genre{display:block;margin:auto auto 18px;font-family:'Cormorant',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--emerald);background:rgba(31,61,46,.08);padding:5px 14px;border:1px solid rgba(31,61,46,.2);}
  .read-btn{margin-top:auto;font-family:'Cormorant',serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--gold);padding:10px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .read-btn:hover{background:var(--marsala);color:var(--parchment-light);border-color:var(--marsala);}
  .read-btn svg{width:14px;height:14px}

  /* ===== MODAL ===== */
  .modal{display:none;position:fixed;inset:0;background:rgba(31,25,18,.85);z-index:1000;overflow-y:auto;padding:30px 20px;backdrop-filter:blur(4px);}
  .modal.active{display:flex;align-items:flex-start;justify-content:center}
  .modal-content{background:var(--parchment-light);max-width:780px;width:100%;margin:20px auto;padding:50px 60px;position:relative;border:1px solid var(--gold);animation:modalIn .4s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
  .modal-content::before,.modal-content::after{content:"";position:absolute;width:40px;height:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M5,5 Q5,50 50,50 Q5,50 5,95' stroke='%23B8863B' stroke-width='1.5' fill='none'/><path d='M5,5 Q50,5 50,50 Q50,5 95,5' stroke='%23B8863B' stroke-width='1.5' fill='none'/><circle cx='50' cy='50' r='3' fill='%23B8863B'/></svg>");background-size:contain;background-repeat:no-repeat;}
  .modal-content::before{top:10px;left:10px}
  .modal-content::after{top:10px;right:10px;transform:scaleX(-1)}
  .modal-ornament-bottom{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:120px;height:20px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 20'><path d='M0,10 Q30,0 60,10 Q90,20 120,10' stroke='%23B8863B' stroke-width='1' fill='none'/><circle cx='60' cy='10' r='3' fill='none' stroke='%23B8863B' stroke-width='1'/></svg>");background-size:contain;background-repeat:no-repeat;}

  .close-btn{position:absolute;top:18px;right:18px;width:40px;height:40px;background:transparent;border:1px solid var(--gold);color:var(--marsala);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;font-family:'Playfair Display',serif;z-index:2;}
  .close-btn:hover{background:var(--marsala);color:var(--parchment-light)}

  .modal-header{text-align:center;padding-bottom:25px;margin-bottom:30px;border-bottom:1px solid var(--gold);position:relative;}
  .modal-header::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:var(--parchment-light);border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg);}
  .modal-genre{font-family:'Cormorant',serif;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-shadow);margin-bottom:12px;}
  .modal-title{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,4vw,42px);color:var(--ink);line-height:1.1;margin-bottom:10px;letter-spacing:.01em;}
  .modal-author{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:var(--marsala);}
  .modal-text{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.7;color:var(--ink);white-space:pre-line;}
  .modal-text p{margin-bottom:18px;text-indent:2em}
  .modal-text p:first-child{text-indent:0}
  .modal-text p:first-child::first-letter{font-family:'Playfair Display',serif;font-weight:900;font-size:64px;float:left;line-height:.9;padding:8px 12px 0 0;color:var(--marsala);}

  /* ===== FOOTER ===== */
  footer{
    margin-top:80px;
    text-align:center;
    padding:50px 40px 40px;
    position:relative;
    border:1px solid var(--gold);
    background:linear-gradient(180deg,rgba(243,233,210,.3) 0%,rgba(245,239,223,.6) 100%);
  }
  footer::before,footer::after{
    content:"";position:absolute;width:60px;height:60px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M5,5 Q5,50 50,50 Q5,50 5,95' stroke='%23B8863B' stroke-width='1.5' fill='none'/><path d='M5,5 Q50,5 50,50 Q50,5 95,5' stroke='%23B8863B' stroke-width='1.5' fill='none'/><circle cx='50' cy='50' r='3' fill='%23B8863B'/></svg>");
    background-size:contain;background-repeat:no-repeat;
  }
  footer::before{top:-8px;left:-8px}
  footer::after{bottom:-8px;right:-8px;transform:scaleX(-1)}
  .footer-ornament-top{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:200px;height:30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30'><path d='M0,15 Q50,0 100,15 Q150,30 200,15' stroke='%23B8863B' stroke-width='1' fill='none'/><circle cx='100' cy='15' r='4' fill='none' stroke='%23B8863B' stroke-width='1'/><circle cx='100' cy='15' r='1.5' fill='%23B8863B'/></svg>");
    background-size:contain;background-repeat:no-repeat;
  }
  .footer-eyebrow{
    font-family:'Cormorant',serif;
    font-size:13px;letter-spacing:.45em;
    text-transform:uppercase;
    color:var(--gold-shadow);
    margin-bottom:14px;
  }
  .footer-line{
    width:120px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:0 auto 18px;
  }
  .footer-tag{
    display:inline-block;
    font-family:'Cormorant',serif;
    font-size:14px;letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--emerald);
    border:1px solid var(--gold);
    padding:10px 24px;
    text-decoration:none;
    transition:all .3s;
    background:rgba(245,239,223,.4);
  }
  .footer-tag:hover{
    background:var(--marsala);
    color:var(--parchment-light);
    border-color:var(--marsala);
  }
  .footer-note{
    margin-top:18px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--marsala);
    letter-spacing:.03em;
  }

  @media(max-width:768px){
    .page{padding:20px 15px 60px}header,footer{padding:40px 20px 35px}
    .modal-content{padding:40px 25px}.books-grid{grid-template-columns:1fr;gap:20px}
    .era-header{padding:14px 20px}.book-card{min-height:auto}
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow">Imperial Collection · Est. MMXXV</div>
    <h1>Russian Literature <span class="amp">&</span> Poetry</h1>

<div class="modal" id="modal">

      <div class="modal-genre" id="mGenre"></div>

    <div class="modal-ornament-bottom"></div>
  </div>
</div>

<script>
const icons = {
  novel:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M12 8h28v48H12z"/><path d="M40 12h12v40H40z"/><path d="M18 18h16M18 26h16M18 34h12"/></svg>`,
  poem:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M32 6 L32 42"/><path d="M32 42 Q28 50 24 56 L20 58"/><path d="M32 42 Q36 50 40 56 L44 58"/><circle cx="32" cy="8" r="2"/></svg>`,
  drama:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M18 20 Q18 36 32 36 Q46 36 46 20"/><path d="M24 26 Q24 30 28 30"/><path d="M36 26 Q36 30 40 30"/><path d="M26 34 Q32 38 38 34"/><path d="M14 40 Q14 56 32 56 Q50 56 50 40"/><path d="M22 46 Q22 50 26 50"/><path d="M38 46 Q38 50 42 50"/><path d="M24 52 Q32 48 40 52"/></svg>`,
  fairy:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M20 56 L20 32 Q20 20 32 14 Q44 20 44 32 L44 56"/><path d="M28 56 L28 40 L36 40 L36 56"/><path d="M32 14 L32 8"/><circle cx="32" cy="6" r="2"/><path d="M14 56 L50 56"/></svg>`,
  comedy:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><circle cx="32" cy="32" r="22"/><path d="M22 26 Q24 24 26 26"/><path d="M38 26 Q40 24 42 26"/><path d="M22 36 Q32 46 42 36"/><path d="M10 18 Q16 12 22 14"/><path d="M54 18 Q48 12 42 14"/></svg>`,
  novella:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M16 12 L48 12 L44 52 L20 52 Z"/><path d="M20 20 L44 20"/><path d="M21 28 L43 28"/><path d="M22 36 L42 36"/><path d="M24 44 L40 44"/><path d="M28 8 L36 8 L36 12 L28 12 Z"/></svg>`,
  short:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M28 14 L28 8 L36 8 L36 14"/><path d="M24 14 L40 14 L38 50 L26 50 Z"/><path d="M28 22 L36 22"/><path d="M28 30 L36 30"/><path d="M28 38 L34 38"/><path d="M20 50 L44 50"/><path d="M30 8 Q32 4 34 8"/></svg>`,
  children:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M32 8 L36 20 L48 20 L38 28 L42 40 L32 32 L22 40 L26 28 L16 20 L28 20 Z"/><path d="M20 44 L44 44 L44 56 L20 56 Z"/><path d="M26 48 L38 48"/><path d="M26 52 L34 52"/></svg>`,
  scifi:`<svg viewBox="0 0 64 64" fill="none" stroke="#7A2E22" stroke-width="1.5"><path d="M32 10 L32 40"/><path d="M26 20 L38 20"/><path d="M28 40 L36 40 L38 52 L26 52 Z"/><circle cx="32" cy="10" r="4"/><path d="M18 28 Q18 22 24 22"/><path d="M46 28 Q46 22 40 22"/><path d="M20 52 L44 52"/><path d="M14 56 L50 56"/><circle cx="20" cy="16" r="1" fill="#7A2E22"/><circle cx="44" cy="18" r="1" fill="#7A2E22"/></svg>`
};

const books = [
  {id:1,title:"The Captain's Daughter",author:"A. Pushkin",genre:"Novel",era:"golden",icon:"novel",text:`My reflections upon the road were not of the pleasant kind. The loss at play was according to my circumstances, not inconsiderable. I was to acknowledge to myself, that my behaviour in the hotel at Simbirsk was very foolish. I also felt wrong and unjust in regard to Savelitch. All these reflections tormented me. The old man sat and silent, sighing only from time to time. I wanted absolutely to make it up with him, but did not know how to begin it. At last, I said to him: "Well Savelitch, let bygones be bygones, and let us make peace; I was wrong, I see it myself. I played stupid tricks yesterday, and insulted you today without reason. I promise you, however, to act henceforth more reasonably, and to take your advice. Do not be angry any more, we will be friends."\n\n"Ah, my dear Peter Andreitch," he answered with a deep drawn sigh, "I am angry against myself; it is I who have committed a thorough blunder. How could I leave you alone in the hotel? Alas! If it is a man's destiny to sin, he will do it. How came it into my head to visit my godmother, the wife of the sexton? I am just situated as the proverb says:\n\nWent his god-mother to see,\nTo the gibbet finally came he.\n\nI am a lost man! How shall I again show myself before my master and mistress?"\n\nIn order to console poor Savelitch, I made him the promise not to dispose in future of a single kopek without his acquiescence. By and by, he got a little consoled, although still shaking his head from time to time, and muttering now and then "hundred roubles – a trifle!"\n\nI approached my destination. Around me, as far as I could see, was nothing but a dull wilderness, crossed by hills and gulfs. Everywhere was deep snow. Our kabitka drove along the small road, or rather along the track made by the sledges of the peasants. At last the coachman began to look sideways and finally taking off his hat and turning to me, said,\n\n"Master, shall we not return?"\n\n"What for?"\n\n"The weather begins to be threatening. The wind rises visibly. Do you see how it drives the snow away?"\n\n"What then?"\n\n"But do you not see there?" pointing with his whip to the east.\n\n"I see nothing beside the white steppe and the clear heavens."\n\n"Yonder, that small cloud."\n\nI now began to perceive on the horizon, a little white cloud, which I had mistaken at first for a distant hill.`},
  {id:2,title:"The Snow Maiden",author:"A. Ostrovsky",genre:"Fairy Tale",era:"golden",icon:"fairy",text:`An old man and his wife had no children. They were very sad about this. "Let's make a child out of snow," said the man one day.\n\nThey made a pretty snow-girl. "Look!" said the woman. "Her lips are red and her eyes are open!" The snow-girl was alive!\n\nThe old couple were very happy. They called their new daughter Snegurochka. She was kind and polite. But she was pale and shy.\n\nSummer came. Snegurochka was not well. "Go out to play," her parents said. They were worried.\n\nSnegurochka went to the forest with her friends. But is was very hot, and Snegurochka wasn't happy.\n\n"Let's jump over a fire," the girls said. Snegurochka jumped – and melted. She was gone forever.`},
  {id:3,title:"First Love",author:"I. Turgenev",genre:"Novella",era:"golden",icon:"novella",text:`On that day I went as usual into the garden, and happened to go close to the low fence which separated our garden from the neighbours'. Suddenly I heard a voice; I looked across the fence, and was thunder-struck.\n\nA few steps from me on the grass between the green raspberry bushes stood a tall slender girl in a striped pink dress. Four young men were close round her, and she was slapping them by turns on the forehead with those small grey flowers, the name of which I don't know, though they are well known to children. The flowers form little bags, and burst open with a pop when you strike them against anything hard.\n\nThe young men presented their foreheads so eagerly, and in the gestures of the girl, there was something so fascinating, imperious, mocking, and charming, that I almost cried out with admiration and delight. I thought, I would give everything in the world at once only to find myself one of these young men. I forgot everything; I stared at the graceful shape and lovely arms and the slightly disordered fair hair.\n\n'Young man, hey, young man,' said a voice suddenly near me: 'is it allowed to stare so at unfamiliar young ladies?'\n\nNear me, the other side of the fence, stood a man with close-cropped black hair, looking ironically at me. At the same instant the girl also turned towards me. ... I caught sight of big grey eyes in a bright mobile face, and the whole face suddenly quivered and laughed, there was a flash of the white teeth, a funny lifting of the eyebrows. I blushed and fled to my own room, threw myself on the bed, and hid my face in my hands. My heart was fairly leaping; I was greatly ashamed and overjoyed; I felt an excitement I had never known before.\n\nAfter a rest, I brushed my hair, washed, and went downstairs to tea. The image of the young girl floated in front of me, my heart was no longer leaping, but was full of a sort of sweet oppression.\n\n'What's the matter?' my father asked me all at once.\n\nI was on the point of telling him all about it, but I controlled myself, and only smiled to myself. As I was going to bed, I rotated — I don't know why — three times on one leg, pomaded my hair, got into bed, and slept like a log all night.`},
  {id:4,title:"Crime and Punishment",author:"F. Dostoevsky",genre:"Novel",era:"realism",icon:"novel",text:`"What's to be done, what's to be done?" repeated Sonia, weeping hysterically and wringing her hands.\n\n"What's to be done? Break what must be broken, once and for all, that's all, and take the suffering on oneself. What, you don't understand? You'll understand later. ... Freedom and power, and above all, power! Over all trembling creation and all the ant-heap! ... That's the goal, remember that! That's my farewell message. Perhaps it's the last time I shall speak to you. If I don't come tomorrow, you'll hear of it all, and then remember these words. And some day later on, in years to come, you'll understand perhaps what they meant. If I come to-morrow, I'll tell you who killed Lizaveta. ... Good-bye."\n\nSonia started with terror.\n\n"Why, do you know who killed her?", she asked, chilled with horror, looking wildly at him.\n\n"I know and will tell... you, only you. I have chosen you out. I'm not coming to you to ask forgiveness, but simply to tell you. I chose you out long ago to hear this, when your father talked of you and when Lizaveta was alive, I thought of it. Good-bye, don't shake hands. Tomorrow!"\n\nHe went out. Sonia gazed at him as at a madman. But she herself was like one insane and felt it. Her head was going round.\n\n"Good heavens, how does he know who killed Lizaveta? What did those words mean? It's awful!" But at the same time the idea did not enter her head, not for a moment! "Oh, he must be terribly unhappy! ... He has abandoned his mother and sister. ... What for? What has happened? And what had he in his mind? What did he say to her? He had kissed her foot and said ... said (yes, he had said it clearly) that he could not live without her. ... Oh, merciful heavens!"\n\nSonia spent the whole night feverish and delirious. She jumped up from time to time, wept and wrung her hands, then sank again into feverish sleep and dreamt of Polenka, Katerina Ivanovna and Lizaveta, of reading the gospel and him ... him with pale face, with burning eyes ... kissing her feet, weeping.\n\nOn the other side of the door on the right, which divided Sonia's room from Madame Resslich's flat, was a room which had long stood empty. A card was fixed on the gate and a notice stuck in the windows over the canal advertising it to let. Sonia had long been accustomed to the rooms being uninhabited. But all that time Mr. Svidrigailov had been standing, listening at the door of the empty room. When Rascolnikov went out he stood still, thought a moment, went on tiptoe to his own room which adjoined the empty one, brought a chair, and noiselessly carried it to the door that led to Sonia's room. The conversation had struck him as interesting and remarkable, and he had greatly enjoyed it – so much that he brought a chair that he might not in the future, tomorrow, for instance, have to endure the inconvenience of standing a whole hour, but might listen in comfort.`},
  {id:5,title:"A Malefactor",author:"A. Chekhov",genre:"Short Story",era:"realism",icon:"short",text:`A very thin, small peasant, dressed in a rough striped shirt and patched trousers, stands before the investigating magistrate. His face is covered with hair and scarred from smallpox, and his eyes can just be seen under his thick, heavy eyebrows. The hair on his head is long and tangled. He wears no shoes and he looks miserable and depressed.\n\n"Dennis Grigoryev!" the magistrate begins. "Come nearer, and answer my questions. On the seventh of July the railway watchman, Ivan Semyonovitch Akinfov, found you unscrewing one of the nuts that fix the rails. Was this so?"\n\n"Wha-at?"\n\n"Is this true?"\n\n"To be sure, it is true."\n\n"Very good; well, what were you unscrewing the nut for?"\n\n"Wha-at?"\n\n"Stop saying 'wha-at' and answer the question; what were you unscrewing the nut for?"\n\n"The nut? We make weights out of those nuts for our fishing lines."\n\n"Who is 'we'?"\n\n"We, people ... . The Klimovo peasants, that is."\n\n"Listen, my man; don't play the idiot with me, but speak sensibly. It's no use telling lies here!"\n\n"You must understand that the nut holds the rails to the sleepers!"\n\n"We understand that ... . We don't unscrew them all ... we leave some ... . We don't do it thoughtlessly ... we understand ..."\n\n"Last year the train went off the rails here," says the magistrate. "Now I see why!"\n\n"What do you say, your honour?"\n\n"I am telling you that now I see why the train went off the rails last year ... I understand!"`},
  {id:6,title:"The Tale of the Silly Little Mouse",author:"S. Marshak",genre:"Children's Poetry",era:"modern",icon:"children",text:`Once upon a time there lived a little mouse. He lived with his mum in their little cosy house. One night Little Mouse went to bed but couldn't sleep. His mother began singing a lullaby ['lʌləbaɪ] song to him. But Little Mouse didn't like her singing. He thought her voice was very thin.\n\nMother Mouse ran away and came back with a duck. The duck began singing but Little Mouse thought her voice was very loud [laud]...\n\n... a horse (Her song was scary ['skeəri].)\n... a frog (Her song wasn't interesting.)`},
  {id:7,title:"The Caves of Steel",author:"I. Asimov",genre:"Sci-Fi Novel",era:"modern",icon:"scifi",text:`The boss smiled. "I had this arranged specially last year, Lije. I don't think I've showed it to you before. Come over here and take a look. In the old days, all rooms had things like this. They were called 'windows'. Did you know that?" Baley knew that very well, having viewed many historical novels. "I've heard of them," he said. "Come here," said the boss.\n\nBaley squirmed a bit. There was something strange about the privacy of a room being exposed to the outside world. Sometimes the boss was over the top with his affection for the past. Like with his glasses, Baley thought. That was it! That was what made him look wrong! He said, "Pardon me, Boss, but you're wearing new glasses, aren't you?" The boss stared at him in mild surprise, took off his glasses, looked at them and then at Baley. Without his glasses, his round face seemed rounder. He looked confused, too, as his eyes couldn't focus properly. He said, "Yes." He put his glasses back on his nose, then added with real anger, "I broke my old ones three days ago. What with one thing or another I wasn't able to replace them until this morning. Lije, those three days were awful." "On account of the glasses?" Baley asked.\n\n"And other things, too. I will tell you about that." He turned to the window. With mild shock, Baley realised it was raining. For a minute, he was lost in the sight of water dropping from the sky, while the boss displayed a kind of pride as though the phenomenon was something he'd arranged. "This is the third time this month I've watched it rain. Amazing, don't you think?"\n\nAgainst his will, Baley had to admit to himself that he was impressed. In his forty-two years he had rarely seen rain. He said, "It always seems a waste for all that water to come down on the city. It should limit itself to the reservoirs." "Lije," said the boss, "you are too modern. That's your trouble. In the old days, people lived in the open. I don't mean on the farms only. I mean in the cities, too. Even in New York. When it rained, they didn't think of it as waste. They liked it. They lived close to nature. It's healthier, better. The troubles of modern life come from being separated from nature. Read up on the Coal Century, some time."\n\nBaley had. He had heard many people moaning about the invention of the nuclear reactor. He moaned about it himself when things went wrong. Moaning like that was normal in human nature. Back in the Coal Century, people moaned about the invention of the steam engine. In one of Shakespeare's plays, a character moaned about the invention of gunpowder. A thousand years in the future, they'd be moaning about the invention of the human-robot brain.\n\nHe said, grimly, "Look, Julius." (It wasn't normal for him to be so friendly with the boss at work, however many times the boss called him 'Lije'.) "Look, Julius, you're talking about everything except what I came in here for, and it's worrying me. What is it?" The boss said, "I'll get to it, Lije. Let me do it my way. It's - it's trouble." "Sure. What isn't on this planet? More trouble with the Robots?" "In a way, yes, Lije."\n\nThe Spacer standing at the Spacetown entrance was dressed in Earth fashion, but the way he stood, the calm lines of his broad, high-cheekboned face and his short bronze hair showed he was no Earthman.\n\n"I am police officer Elijah Baley, Police Department, City of New York, Rating C-5." Baley showed his badge and went on, "I have been instructed to meet R Daneel Olivaw here." He looked at his watch. "I am a little early. Will you tell him that I have arrived?" He felt nervous and more than a little cold inside. He was used to the Earth-model robots. The Spacer models would be different. He found himself gritting his teeth.\n\nThe Spacer, who had listened politely, said, "It will not be necessary. I have been waiting for you." Baley's hand went up automatically, then dropped. He was too shocked to say anything. The Spacer said, "I shall introduce myself. I am R Daneel Olivaw."\n\n"Yes? Am I making a mistake? I thought the first initial, R, stood for -"\n\n"Quite so. I am a robot. Were you not told?"\n\n"I was told." Baley put a damp hand to his hair. Then he held it out. "I'm sorry, Mr Olivaw. I don't know what I was thinking of. Good day. I am Elijah Baley, your partner."\n\n"Good." The robot shook his hand. "Yet I feel you are uncomfortable. May I ask you to be frank with me? It is best to be honest in a relationship such as ours."\n\n"It's just, you see, that you don't look like a robot," Baley said desperately.\n\n"And that disturbs you?"\n\n"It shouldn't, I suppose, Da- Daneel. Are they all like you on your world?"\n\n"There are differences, Elijah, just as with men. Our own robots ... Well, you can tell they're robots, you understand. You look like a human."\n\n"Oh, I see. You expected a rather basic model and were surprised. Yet it is only logical that our people use a robot that looks like a human in this case. Is that not so?"\n\nIt was certainly so. An obvious robot roaming the city would soon be in trouble. Baley said, "Yes."\n\n"Then let us leave now, Elijah."\n\nThey made their way back to the endless cars of the expressway and scrambled aboard. Baley was red. He swallowed twice.\n\n"Down here?" the robot said. "Is my information wrong? I was told that a rating of C-5 allowed someone a seat on the upper level."\n\n"You're right. He can go up there, but you can't."\n\n"Why can I not go up with you?"\n\n"It takes a C-5, Daneel."\n\n"I am aware of that."\n\n"You're not a C-5." Baley was understandably anxious to keep his voice low.\n\nR Daneel said, "Why should I not be a C-5? I am your partner. I was given this." From his shirt pocket he took a rectangular police identity card. The name given was Daneel Olivaw, without the all-important first initial. The rating was C-5.\n\n"Come on up," said Baley. Baley looked straight ahead, once seated, angry with himself. He had been caught twice. First he had not recognised R Daneel as a robot; secondly, he had not guessed that R Daneel must have a C-5 rating. Of course, Baley was not the perfect policeman of popular myth. He was not constantly calm, adaptable to any situation, and mentally as quick as lightning. He had never supposed he was. What made him regret it was that R Daneel Olivaw was that very same myth, embodied. He had to be. He was a robot.`}
];

const eras = {
  golden:{title:"Golden Age",years:"1800 – 1850"},
  realism:{title:"Realism",years:"1850 – 1900"},
  modern:{title:"20th Century",years:"1900 – 1990"}
};

function render(){
  const lib = document.getElementById("library");
  lib.innerHTML = "";
  const order = ["golden","realism","modern"];
  order.forEach(eraKey=>{
    const eraBooks = books.filter(b=>b.era===eraKey);
    if(!eraBooks.length) return;
    const section = document.createElement("div");
    section.className = "era-section";
    section.innerHTML = `
      <div class="era-header">
        <span class="era-year">${eras[eraKey].years}</span>
        <h2 class="era-title">${eras[eraKey].title}</h2>
        <span class="era-count">${eraBooks.length} works</span>
      </div>
      <div class="books-grid">
        ${eraBooks.map(b=>`
          <div class="book-card" onclick="openModal(${b.id})">
            <div class="book-icon">${icons[b.icon]}</div>
            <div class="book-title">${b.title}</div>
            <div class="book-author">${b.author}</div>
            <span class="book-genre">${b.genre}</span>
            <button class="read-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
              Read Text
            </button>
          </div>
        `).join("")}
      </div>
    `;
    lib.appendChild(section);
  });
}

function openModal(id){
  const b = books.find(x=>x.id===id);
  document.getElementById("mGenre").textContent = b.genre;
  document.getElementById("mTitle").textContent = b.title;
  document.getElementById("mAuthor").textContent = b.author;
  document.getElementById("mText").innerHTML = `<p>${b.text}</p>`;
  document.getElementById("modal").classList.add("active");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("active");
  document.body.style.overflow="auto";
}
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal") closeModal();
});

render();
</script>
</body>
</html>
